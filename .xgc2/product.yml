schema: xgc2.product.v1
id: xgc2-ros1-tools-adapter
name: XGC2 ROS1 Tools Adapter
version: 0.2.0-4
kind: ros1-apt
summary: Generic typed ROS1 topic-publish and service-call capabilities provided as
  an XGC2 Adapter Runtime application.
groups:
- ros1
- communication
- adapter
ros:
  distro: noetic
  workspace: catkin
  packages:
  - xgc_ros1_tools_adapter
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-ros1-tools-adapter
  packages:
  - ros-noetic-xgc2-ros1-tools-adapter
  depends:
  - libjsoncpp1
  - libxgc2-adapter-runtime-client2
  - ros-noetic-ros-babel-fish
  - ros-noetic-roscpp
  - ros-noetic-roslib
  - ros-noetic-std-msgs
  - ros-noetic-std-srvs
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-ros1-tools-adapter

    '
  smoke_test: 'rospack find xgc_ros1_tools_adapter

    test -x /opt/ros/noetic/lib/xgc_ros1_tools_adapter/xgc_ros1_tools_adapter_node

    test -x /opt/ros/noetic/lib/xgc_ros1_tools_adapter/xgc_ros1_tools_adapter_service_helper

    test -f /usr/share/xgc2/adapter-definitions/xgc2-ros1-tools-adapter.json


    '
  notes: 'Core or Agent supervises one process per ROS1 native context and supplies
    a

    mode-0600 binary AdapterProcessBootstrap. The process exposes no listener

    other than its outbound connection to the target-local Adapter Runtime.

    Builds require the exact 0.6.0 SDK and 0.5.0-3 schema inputs. Installed applications

    require only the ABI-2 Runtime shared-library package; SDK headers and schema

    sources do not participate in the deployment dependency graph.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/xgc_ros1_tools_adapter
  - /opt/ros/noetic/lib/xgc_ros1_tools_adapter/xgc_ros1_tools_adapter_node
  - /opt/ros/noetic/lib/xgc_ros1_tools_adapter/xgc_ros1_tools_adapter_service_helper
  - /usr/share/xgc2/adapter-definitions/xgc2-ros1-tools-adapter.json
release:
  repository: lxk36/xgc2-ros1-tools-adapter
  ref: noetic
  workflow: release.yml
  ci_workflow: ci.yml
  requires:
  - libxgc2-adapter-runtime-client-dev
  - xgc2-protobuf
  dependency_policy:
    libxgc2-adapter-runtime-client-dev: rebuild
    xgc2-protobuf: rebuild
  apt_versions:
    focal: 0.2.0-4